server:
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Production must never mutate schema implicitly. Apply an explicit
      # migration/restore before starting this profile.
      ddl-auto: validate
    show-sql: false
    defer-datasource-initialization: false

  sql:
    init:
      # Development seed data must never run in production.
      mode: never
