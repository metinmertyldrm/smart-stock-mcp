server:
  port: 8081

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  application:
    name: stock-service

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_stock
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Keep existing inventory and order data when the service restarts.
      # Override with DB_DDL_AUTO=create only when a full local reset is intended.
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      data-locations: classpath:data.sql
