version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web-ui
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /stock-service
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /llm-host
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /stock-mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /marketplace-mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:50"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
