name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            llm-host/requirements.txt
            stock-mcp/requirements.txt
            marketplace-mcp/requirements.txt

      - name: Install Python dependencies
        run: >-
          python -m pip install
          -r llm-host/requirements.txt
          -r stock-mcp/requirements.txt
          -r marketplace-mcp/requirements.txt

      - name: Verify installed Python packages
        run: python -m pip check

      - name: Run unit tests
        run: |
          python -m unittest discover -s llm-host -p 'test_*.py'
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Run golden AI evaluation
        run: python llm-host/golden_eval.py

      - name: Compile Python modules
        run: |
          python -m py_compile llm-host/*.py
          python -m py_compile stock-mcp/*.py
          python -m py_compile marketplace-mcp/*.py
          python -m py_compile scripts/smoke_stack.py

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  java:
    name: Java verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stock-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven project
        run: mvn -B verify

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate default Compose configuration
        run: docker compose config --quiet

      - name: Validate acceptance Compose profile
        run: docker compose --profile acceptance config --quiet

  container-build:
    name: Application container builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application images
        run: docker compose build stock-service llm-host web-ui

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python
      - frontend
      - java
      - compose
      - container-build
    steps:
      - name: Require all CI jobs to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          CONTAINER_BUILD_RESULT: ${{ needs.container-build.result }}
        run: |
          printf 'python=%s\nfrontend=%s\njava=%s\ncompose=%s\ncontainer_build=%s\n' \
            "$PYTHON_RESULT" "$FRONTEND_RESULT" "$JAVA_RESULT" "$COMPOSE_RESULT" \
            "$CONTAINER_BUILD_RESULT"
          test "$PYTHON_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$JAVA_RESULT" = success
          test "$COMPOSE_RESULT" = success
          test "$CONTAINER_BUILD_RESULT" = success
