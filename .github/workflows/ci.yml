name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            llm-host/requirements.txt
            stock-mcp/requirements.txt
            marketplace-mcp/requirements.txt

      - name: Install Python dependencies
        run: >-
          python -m pip install
          -r llm-host/requirements.txt
          -r stock-mcp/requirements.txt
          -r marketplace-mcp/requirements.txt

      - name: Verify installed Python packages
        run: python -m pip check

      - name: Run unit tests
        run: |
          python -m unittest discover -s llm-host -p 'test_*.py'
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Run golden AI evaluation
        run: python llm-host/golden_eval.py

      - name: Compile Python modules
        run: |
          python -m py_compile llm-host/*.py
          python -m py_compile stock-mcp/*.py
          python -m py_compile marketplace-mcp/*.py
          python -m py_compile scripts/*.py

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  java:
    name: Java verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stock-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven project
        run: mvn -B verify

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate default Compose configuration
        run: docker compose config --quiet

      - name: Validate acceptance Compose profile
        run: docker compose --profile acceptance config --quiet

  production-contract:
    name: Production contract and migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_NAME: smart_stock_prod_ci
      DB_USERNAME: smartstock_ci
      DB_PASSWORD: ci-production-database-secret-42x
      LLM_AUTH_MODE: local
      LLM_BOOTSTRAP_ADMIN_USERNAME: ci-admin
      LLM_BOOTSTRAP_ADMIN_PASSWORD: ci-separate-admin-secret-84x
      PUBLIC_ORIGIN: https://stock.example.test
      WEB_BIND_ADDRESS: 127.0.0.1
      WEB_PORT: '18080'
      POSTGRES_IMAGE: postgres:17@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      OLLAMA_IMAGE: ollama/ollama:0.0.0@sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      OLLAMA_MODEL: qwen3:8b
      LLM_SESSION_TTL_SECONDS: '86400'
    services:
      postgres:
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_DB: smart_stock_prod_ci
          POSTGRES_USER: smartstock_ci
          POSTGRES_PASSWORD: ci-production-database-secret-42x
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartstock_ci -d smart_stock_prod_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Validate fail-closed production environment
        run: python scripts/validate_production_env.py

      - name: Audit production Compose contract
        run: python scripts/production_smoke.py --config-only

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build stock service with migrations
        working-directory: stock-service
        run: mvn -B -DskipTests package

      - name: Verify fresh production database migration and Hibernate validation
        working-directory: stock-service
        env:
          SPRING_PROFILES_ACTIVE: production
          DB_URL: jdbc:postgresql://localhost:5432/smart_stock_prod_ci
          SERVER_PORT: '18081'
          CORS_ALLOWED_ORIGINS: https://stock.example.test
        run: |
          set -euo pipefail
          java -jar target/stock-service-*.jar > /tmp/stock-production.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/api/products > /tmp/products.json; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/stock-production.log
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/products.json').read_text())
          assert isinstance(payload, list), payload
          assert payload == [], 'production migration must not load demo seed rows'
          PY

          grep -q "Started StockServiceApplication" /tmp/stock-production.log

  container-build:
    name: Application container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build development application images
        run: docker compose build stock-service llm-host web-ui

      - name: Build hardened production application images
        run: |
          docker build -t smart-stock-stock:ci -f stock-service/Dockerfile.prod stock-service
          docker build -t smart-stock-llm:ci -f llm-host/Dockerfile.prod .
          docker build -t smart-stock-web:ci -f web-ui/Dockerfile.prod web-ui

      - name: Verify production gateway identity boundary
        run: |
          set -euo pipefail
          network="smart-stock-task10-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f task10-web task10-llm task10-stock >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          docker network create "$network" >/dev/null

          cat >/tmp/task10_mock_stock.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *_args):
                  pass

              def do_GET(self):
                  if self.headers.get("Authorization"):
                      body = json.dumps({"error": "bearer leaked to stock backend"}).encode()
                      self.send_response(500)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  if self.path == "/api/products":
                      body = b"[]"
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  self.send_response(404)
                  self.end_headers()

          ThreadingHTTPServer(("0.0.0.0", 8081), Handler).serve_forever()
          PY

          docker run -d --name task10-stock --network "$network" --network-alias stock-service \
            --entrypoint python -v /tmp/task10_mock_stock.py:/tmp/task10_mock_stock.py:ro \
            smart-stock-llm:ci /tmp/task10_mock_stock.py >/dev/null

          docker run -d --name task10-llm --network "$network" --network-alias llm-host \
            -e LLM_AUTH_MODE=local \
            -e LLM_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e LLM_BOOTSTRAP_ADMIN_PASSWORD=ci-gateway-admin-secret-42x \
            -e LLM_SESSIONS_DB=/data/sessions.db \
            -e LLM_IDENTITY_DB=/data/identity.db \
            -e LLM_CONVERSATIONS_DB=/data/conversations.db \
            -e STOCK_SERVICE_URL=http://stock-service:8081 \
            -e OLLAMA_URL=http://unused-ollama:11434/api/generate \
            -e LLM_MODEL=qwen3:8b \
            -e APP_ENV=production \
            smart-stock-llm:ci >/dev/null

          docker run -d --name task10-web --network "$network" \
            -p 127.0.0.1:18082:8080 smart-stock-web:ci >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18082/llm/api/auth/config >/tmp/task10-auth-config.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs task10-llm || true
            docker logs task10-web || true
            exit 1
          fi

          status=$(curl -sS -o /tmp/task10-unauth-stock.json -w '%{http_code}' \
            http://127.0.0.1:18082/stock/api/products)
          test "$status" = 401

          login_json=$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"ci-gateway-admin-secret-42x"}' \
            http://127.0.0.1:18082/llm/api/auth/login)
          token=$(printf '%s' "$login_json" | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          test -n "$token"

          curl -fsS -H "Authorization: Bearer $token" \
            http://127.0.0.1:18082/stock/api/products \
            | python -c 'import json,sys; assert json.load(sys.stdin) == []'

          status=$(curl -sS -o /tmp/task10-write.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $token" \
            http://127.0.0.1:18082/stock/api/marketplace/orders)
          test "$status" = 405

          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $token" \
            http://127.0.0.1:18082/llm/api/auth/logout
          status=$(curl -sS -o /tmp/task10-revoked-stock.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            http://127.0.0.1:18082/stock/api/products)
          test "$status" = 401

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python
      - frontend
      - java
      - compose
      - production-contract
      - container-build
    steps:
      - name: Require all CI jobs to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          PRODUCTION_RESULT: ${{ needs.production-contract.result }}
          CONTAINER_BUILD_RESULT: ${{ needs.container-build.result }}
        run: |
          printf 'python=%s\nfrontend=%s\njava=%s\ncompose=%s\nproduction=%s\ncontainer_build=%s\n' \
            "$PYTHON_RESULT" "$FRONTEND_RESULT" "$JAVA_RESULT" "$COMPOSE_RESULT" \
            "$PRODUCTION_RESULT" "$CONTAINER_BUILD_RESULT"
          test "$PYTHON_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$JAVA_RESULT" = success
          test "$COMPOSE_RESULT" = success
          test "$PRODUCTION_RESULT" = success
          test "$CONTAINER_BUILD_RESULT" = success
