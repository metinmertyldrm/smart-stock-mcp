services:
  postgres:
    image: postgres:17
    container_name: smart-stock-postgres
    environment:
      POSTGRES_DB: smart_stock
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d smart_stock"]
      interval: 5s
      timeout: 5s
      retries: 20

  stock-service:
    build:
      context: ./stock-service
    container_name: smart-stock-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/smart_stock
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: 8081
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${STOCK_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/products >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: smart-stock-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30

  ollama-init:
    image: ollama/ollama:latest
    container_name: smart-stock-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $$OLLAMA_MODEL"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  llm-host:
    build:
      context: .
      dockerfile: llm-host/Dockerfile
    container_name: smart-stock-llm-host
    environment:
      STOCK_SERVICE_URL: http://stock-service:8081
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-20}
      OLLAMA_READ_TIMEOUT: ${OLLAMA_READ_TIMEOUT:-300}
      LLM_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
      LLM_CONVERSATIONS_DB: /data/conversations.db
    ports:
      - "${LLM_HOST_PORT:-8000}:8000"
    depends_on:
      stock-service:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - llm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web-ui:
    build:
      context: ./web-ui
      args:
        VITE_API_BASE_URL: http://localhost:${STOCK_SERVICE_PORT:-8081}
        VITE_LLM_HOST_URL: http://localhost:${LLM_HOST_PORT:-8000}
    container_name: smart-stock-web-ui
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      llm-host:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-acceptance:
    image: postgres:17
    profiles: ["acceptance"]
    container_name: smart-stock-postgres-acceptance
    environment:
      POSTGRES_DB: smart_stock_acceptance
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${ACCEPTANCE_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d smart_stock_acceptance"]
      interval: 5s
      timeout: 5s
      retries: 20

  stock-service-acceptance:
    build:
      context: ./stock-service
    profiles: ["acceptance"]
    container_name: smart-stock-service-acceptance
    environment:
      SPRING_PROFILES_ACTIVE: acceptance
      DB_URL: jdbc:postgresql://postgres-acceptance:5432/smart_stock_acceptance
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: 8082
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${ACCEPTANCE_STOCK_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres-acceptance:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/api/products >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  ollama-data:
  llm-data:
