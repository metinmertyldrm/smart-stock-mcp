server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Docker'in gomulu DNS'i. proxy_pass'te sabit bir isim kullanildiginda nginx
    # adresi YALNIZCA acilista cozer ve o IP'yi omur boyu saklar; arka uc
    # konteyneri yeniden kurulup yeni IP aldiginda nginx eski adrese gitmeye
    # devam eder ve 502 (Host is unreachable) doner. Degisken kullanildiginda
    # cozum istek aninda yapilir. 02.09.2026'da bu yasandi.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # Browser-facing stock API is deliberately read-only. Mutation endpoints
    # stay reachable only on the Docker-internal network by MCP services.
    location /stock/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $stock_upstream http://stock-service:8081;
        rewrite ^/stock/(.*)$ /$1 break;
        proxy_pass $stock_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # LLM-host requests keep their Bearer session header and flow through the
    # secured ASGI entry point. This avoids publishing the LLM port to the host.
    location /llm/ {
        set $llm_upstream http://llm-host:8000;
        rewrite ^/llm/(.*)$ /$1 break;
        proxy_pass $llm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Yerel cikarim uzun surer; nginx'in 60s varsayilani istegi
        # llm-host cevaplamadan kesip 504 donuyordu. Ust sinir,
        # OLLAMA_READ_TIMEOUT degerinin uzerinde tutulur (300s varsayilan,
        # yavas makinede 900s'e cikarilabilir).
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 960s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
