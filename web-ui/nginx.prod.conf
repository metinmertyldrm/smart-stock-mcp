server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Docker'in gomulu DNS'i. proxy_pass'te sabit bir isim kullanildiginda nginx
    # adresi YALNIZCA acilista cozer ve o IP'yi omur boyu saklar; arka uc
    # konteyneri yeniden kurulup yeni IP aldiginda nginx eski adrese gitmeye
    # devam eder ve 502 (Host is unreachable) doner. Degisken kullanildiginda
    # cozum istek aninda yapilir. 02.09.2026'da bu yasandi.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # Internal authorization subrequest. The browser session cookie is validated
    # by llm-host and is never forwarded to stock-service itself.
    location = /_auth {
        internal;
        set $auth_upstream http://llm-host:8000/api/auth/me;
        proxy_pass $auth_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /stock/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        auth_request /_auth;
        set $stock_upstream http://stock-service:8081;
        rewrite ^/stock/(.*)$ /$1 break;
        proxy_pass $stock_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /llm/ {
        set $llm_upstream http://llm-host:8000;
        rewrite ^/llm/(.*)$ /$1 break;
        proxy_pass $llm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 960s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
        return 200 'ok';
    }
}